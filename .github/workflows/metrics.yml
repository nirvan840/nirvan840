name: GitHub Metrics

on:
  schedule: [{cron: "0 0 * * *"}]  # runs daily
  workflow_dispatch:              # allows manual run

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: nirvan840
          base: repositories
          plugin_stars: yes
          plugin_stars_limit: 1000  # optionally increase if you're in many repos
